name: Verify LuxGrowth horizontal navigation
on:
  push:
    branches:
      - feat/luxgrowth-horizontal-menu-v2
      - feat/luxgrowth-crm-foundation-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build