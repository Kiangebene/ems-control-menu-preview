name: Verify LuxGrowth horizontal navigation
on:
  push:
    branches:
      - feat/luxgrowth-horizontal-menu-v2
      - feat/luxgrowth-crm-foundation-v1
      - feat/luxgrowth-websites-foundation-v1
      - feat/luxgrowth-cms-prototype-v1
      - feat/luxgrowth-website-studio-prototype-v1
      - feat/luxgrowth-studio-workspace-v1-1
      - feat/luxgrowth-studio-native-blocks-v1
      - feat/luxgrowth-studio-media-inspector-v1
      - feat/luxgrowth-studio-typography-actions-v1
      - feat/luxgrowth-studio-hero-image-controls-v1
      - feat/luxgrowth-studio-direct-photo-colors-v1
      - feat/luxgrowth-studio-inline-content-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build