<!doctype html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMS Control · Premium Menu Demo</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,Arial;background:#0e1311;color:#f4f7ed;color-scheme:dark;--lime:#c9f268;--panel:#151c1a;--stroke:#ffffff22;--muted:#a4aba7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 15%,#273f4c70,transparent 36%),radial-gradient(ellipse at 83% 93%,#5440385e,transparent 42%),#0c1110}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:3px}.sidebar{position:fixed;z-index:10;top:27px;bottom:27px;left:20px;width:70px;border:1px solid var(--stroke);border-radius:25px;background:#1c2220d9;backdrop-filter:blur(22px);display:flex;flex-direction:column;align-items:center;padding:14px 9px;gap:7px;transition:width .3s}.sidebar.expanded{width:226px;align-items:stretch}.brand{display:flex;align-items:center;gap:10px;border:0;background:none;color:white;min-height:43px;padding:3px 7px;font-weight:800}.mark{display:grid;place-items:center;background:var(--lime);color:#1c2513;border-radius:13px;width:40px;height:40px;flex-shrink:0}.label{display:none}.expanded .label{display:inline}.expand{align-self:center;border:1px solid var(--stroke);background:#313936;color:#f1f1f1;border-radius:40px;padding:4px 10px;margin:10px 0 16px}.sidebtn{border:0;background:none;color:#afbbb4;min-width:48px;height:45px;border-radius:13px;display:flex;gap:15px;align-items:center;justify-content:center;white-space:nowrap;padding:0 12px;transition:background .2s}.expanded .sidebtn{justify-content:flex-start}.sidebtn:hover,.sidebtn.active{background:#c9f26824;color:var(--lime)}.sidebtn.active{box-shadow:inset 3px 0 var(--lime)}.sep{width:65%;height:1px;background:var(--stroke);margin:8px auto}.lower{margin-top:auto;display:flex;flex-direction:column;gap:7px}.wrap{margin-left:120px;max-width:1550px;padding:26px 40px 80px;transition:margin-left .3s}.expanded~.wrap{margin-left:276px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.pill{border:1px solid var(--stroke);border-radius:100px;padding:13px 19px;background:#0c11119c;color:#c1c9c2;font-size:12px;letter-spacing:.03em}.eyebrow{color:var(--lime);font-weight:750;font-size:12px;letter-spacing:.16em;text-transform:uppercase}h1{font-weight:500;font-size:clamp(30px,4.5vw,52px);letter-spacing:-.06em;margin:28px 0 8px}h2{font-size:18px;font-weight:600;letter-spacing:-.025em;margin:0 0 13px}p{color:var(--muted);line-height:1.6;margin:7px 0 20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#151c1acb;border:1px solid var(--stroke);border-radius:21px;padding:23px;min-width:0;backdrop-filter:blur(12px)}.metric{font-size:36px;letter-spacing:-.06em;margin:12px 0}.small{font-size:12px;color:var(--muted)}.visual{height:200px;display:flex;gap:13px;align-items:end;margin-top:24px;border-bottom:1px solid #ffffff25}.bar{flex:1;min-height:10px;background:#c9f268;border-radius:8px 8px 0 0;position:relative;animation:grow .6s ease both;transform-origin:bottom}@keyframes grow{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.bar:nth-child(2n){background:#94bff0}.bar:nth-child(3n){background:#ff9982}.span2{grid-column:span 2}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:19px}.action{border:1px solid var(--stroke);border-radius:25px;padding:10px 17px;color:#f0f5ec;background:#ffffff12}.action.primary{background:var(--lime);color:#17200d;border-color:var(--lime);font-weight:700}.action:hover{filter:brightness(1.15)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #ffffff17}.row:last-child{border:0}.chip{font-size:12px;border-radius:100px;padding:6px 10px;background:#c9f26824;color:var(--lime)}.field{border:1px solid var(--stroke);border-radius:12px;background:#ffffff0b;color:inherit;padding:12px;width:100%}select option{color:black}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.hide{display:none!important}.notice{background:#c9f26812;color:#d8e4c7;padding:15px;border:1px solid #c9f26833;border-radius:12px;margin:17px 0}.searchback{position:fixed;inset:0;z-index:50;background:#000a;display:grid;place-items:start center;padding-top:17vh}.searchbox{background:#202623;border:1px solid #ffffff33;border-radius:20px;padding:24px;width:min(500px,90vw)}.result{width:100%;text-align:left;border:0;border-bottom:1px solid #ffffff18;color:white;background:none;padding:15px;cursor:pointer}.result:hover{background:#ffffff10}.light{--panel:#fafdf8;--stroke:#18261c28;--muted:#59635b;background:#ecf1ea;color:#1d241e;color-scheme:light}.light .sidebar{background:#edf4e9ed}.light .card,.light .pill,.light .searchbox{background:#fff}.light .sidebtn{color:#38453c}.light .sidebtn.active{color:#536f19}.light .action{color:#253326;background:#f7faf5}.light .row{border-color:#1f33251a}.light .field{background:#fff;color:#223}.light .result{color:#222}.light .searchback{background:#0007}footer{color:var(--muted);font-size:12px;margin:35px 0}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.span2{grid-column:span 2}.wrap{padding:18px 20px;margin-left:95px}.expanded~.wrap{margin-left:245px}}@media(max-width:650px){.sidebar{left:8px;top:10px;bottom:10px;width:56px;padding:7px 4px}.sidebar.expanded{width:190px}.sidebtn{min-width:41px}.wrap{margin-left:66px;padding:15px 13px}.expanded~.wrap{margin-left:195px}.grid{grid-template-columns:1fr}.span2{grid-column:span 1}.metric{font-size:30px}.card{padding:17px}.pill{padding:9px;font-size:10px}}
</style></head><body><aside class="sidebar" id="sidebar"><button class="brand" onclick="go('dashboard')"><span class="mark">ϟ</span><span class="label">ems control</span></button><button class="expand" id="expand" onclick="toggleSidebar()" title="Expandir/recolher">›</button><button class="sidebtn" onclick="searchOpen()" title="Pesquisar módulos">⌕ <span class="label">Pesquisar módulos</span></button><button class="sidebtn" onclick="go('configuration')" title="Novo dispositivo">＋ <span class="label">Dispositivos</span></button><div class="sep"></div><nav id="nav"></nav><div class="lower"><div class="sep"></div><button class="sidebtn" onclick="alert('Pesquisa: /\nNavegação: Alt+1 a Alt+5\nTema: botão lua')" title="Ajuda">ⓘ <span class="label">Ajuda</span></button><button class="sidebtn" onclick="themeToggle()" title="Tema claro/escuro">☼ <span class="label">Alterar tema</span></button></div></aside><main class="wrap"><header><span class="eyebrow">ϟ EMS CONTROL</span><span class="pill">● DEMO DATA · PREVIEW</span></header><section id="content"></section><footer>Pré-visualização independente do menu e dos cinco módulos · Dados fictícios · Não ligada a sensores ou backend · Inspirada no projeto React enviado</footer></main><div id="search" class="searchback hide" onclick="if(event.target===this)searchClose()"><div class="searchbox"><div class="row"><strong>Pesquisar módulos</strong><button class="action" onclick="searchClose()">✕</button></div><input id="q" class="field" placeholder="Dashboard, Analytics, Reports..." oninput="searchResults()"><div id="searchresults"></div><p class="small">Enter abre o primeiro resultado · Esc fecha</p></div></div><script>
const navItems=[['dashboard','▦','Dashboard'],['analytics','▥','Analytics'],['configuration','⚙','Configuration'],['reports','▤','Reports'],['settings','◉','Settings & Profile']];
const $=id=>document.getElementById(id);
const stored=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};
let deviceList=stored('ems-live-devices',[{name:'Painel solar A',power:34,on:true},{name:'Inversor B',power:41,on:true},{name:'Bateria C',power:18,on:false}]);let reports=stored('ems-live-reports',[]);
let name=stored('ems-live-name','Utilizador Demo');let page='dashboard';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function go(p){if(!navItems.some(x=>x[0]===p))p='dashboard';page=p;location.hash='/'+p;render();searchClose()}
function toggleSidebar(){let s=$('sidebar');s.classList.toggle('expanded');$('expand').textContent=s.classList.contains('expanded')?'‹':'›';}
function themeToggle(){document.body.classList.toggle('light');save('ems-live-light',document.body.classList.contains('light'))}
function searchOpen(){$('search').classList.remove('hide');$('q').value='';searchResults();$('q').focus()}
function searchClose(){$('search').classList.add('hide')}
function searchResults(){const q=$('q').value.toLowerCase();$('searchresults').innerHTML=navItems.filter(x=>x[2].toLowerCase().includes(q)).map(x=>'<button class="result" onclick="go(\''+x[0]+'\')">'+x[1]+' &nbsp; '+x[2]+'</button>').join('')||'<p>Sem resultados.</p>'}
function metric(label,num,sub){return '<section class="card"><span class="small">'+label+'</span><div class="metric">'+num+'</div><div class="small">'+sub+'</div></section>'}
function bars(vals){return '<div class="visual">'+vals.map(x=>'<div class="bar" style="height:'+x+'%"></div>').join('')+'</div>'}
function button(label,onclick,primary=false){return '<button class="action '+(primary?'primary':'')+'" onclick="'+onclick+'">'+label+'</button>'}
function dashboard(){return '<h1>Energy Overview</h1><p>Visão geral do consumo e da eficiência energética.</p><div class="grid">'+metric('Energia consumida','284,6 <small>kWh</small>','Amostra simulada, últimos 7 dias')+metric('Pico de procura','68,4 <small>kW</small>','Medição demonstrativa')+metric('Dispositivos ativos',deviceList.filter(x=>x.on).length,'Gestão de dispositivos fictícios')+'<section class="card span2"><h2>Consumo de energia</h2><p>Distribuição semanal de referência</p>'+bars([30,56,47,72,50,89,63])+'</section><section class="card"><h2>Estado do sistema</h2><div class="notice">● Dados de demonstração</div><p>Não existem sensores ou ligações em tempo real.</p>'+button('Abrir Analytics',"go('analytics')",true)+'</section></div>'}
function analytics(){return '<h1>Analytics</h1><p>Explora o comportamento energético da instalação.</p><div class="actions">'+button('Últimas 24 horas','refreshAnalytics(0)',true)+button('Últimos 7 dias','refreshAnalytics(1)')+button('Exportar CSV','exportCSV()')+'</div><div class="grid"><section class="card span2"><h2>Energia por período</h2><div id="chart">'+bars([45,62,30,76,58,90,69,56,81,70,63,86])+'</div></section>'+metric('Consumo médio','42,3 kWh','Valores fictícios')+'<section class="card span2"><h2>Comparação de dispositivos</h2><p>Consumo ilustrativo de equipamentos</p>'+bars([48,68,32,80,55,60])+'</section>'+metric('Eficiência','87%','Indicador demonstrativo')+'</div>'}
function refreshAnalytics(i){$('chart').innerHTML=bars(i?[64,56,30,76,45,90,69]:[45,62,30,76,58,90,69,56,81,70,63,86])}
function exportCSV(){download('analytics-demo.csv','periodo,kWh\n1,41\n2,46\n3,55\n4,49')}
function download(n,body){let a=document.createElement('a'),blob=new Blob([body],{type:'text/csv;charset=utf-8'});a.href=URL.createObjectURL(blob);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function configuration(){return '<h1>Configuration</h1><p>Configuração local de dispositivos demonstrativos.</p><div class="grid"><section class="card span2"><h2>Dispositivos</h2><div id="deviceRows">'+deviceRows()+'</div></section><section class="card"><h2>Adicionar dispositivo</h2><form onsubmit="addDevice(event)"><label class="small">Nome</label><input required id="devname" class="field" maxlength="60" placeholder="Nome do dispositivo"><p><label class="small">Potência (kW)</label><input required id="devpower" class="field" type="number" min="1" max="999" value="25"></p><button class="action primary" type="submit">＋ Adicionar</button></form></section></div>'}
function deviceRows(){return deviceList.map((d,i)=>'<div class="row"><div><strong>'+esc(d.name)+'</strong><div class="small">'+esc(d.power)+' kW · '+(d.on?'Ativo':'Pausado')+'</div></div><div>'+button(d.on?'Pausar':'Ativar','toggleDevice('+i+')')+' '+button('✕','removeDevice('+i+')')+'</div></div>').join('')||'<p>Não existem dispositivos.</p>'}
function toggleDevice(i){deviceList[i].on=!deviceList[i].on;save('ems-live-devices',deviceList);render()}
function removeDevice(i){deviceList.splice(i,1);save('ems-live-devices',deviceList);render()}
function addDevice(e){e.preventDefault();deviceList.push({name:$('devname').value,power:Number($('devpower').value),on:true});save('ems-live-devices',deviceList);render()}
function reportsPage(){return '<h1>Reports</h1><p>Cria e exporta relatórios demonstrativos.</p><div class="grid"><section class="card span2"><h2>Histórico</h2>'+(reports.length?reports.map((r,i)=>'<div class="row"><div><strong>'+esc(r)+'</strong><div class="small">Amostra simulada</div></div>'+button('CSV','reportDownload('+i+')')+'</div>').join(''):'<p>Ainda não foram gerados relatórios.</p>')+'</section><section class="card"><h2>Gerar relatório</h2><label class="small">Período</label><select id="period" class="field"><option>Últimos 7 dias</option><option>Últimos 30 dias</option><option>Últimos 90 dias</option></select><div class="notice">Esta versão não contém dados reais nem histórico de sensores.</div>'+button('Gerar relatório','generateReport()',true)+'</section></div>'}
function generateReport(){reports.unshift($('period').value+' · '+new Date().toLocaleString('pt-PT'));save('ems-live-reports',reports);render()}
function reportDownload(i){download('ems-report-'+(i+1)+'.csv','tipo,valor\nconsumo_simulado,284.6\npico_simulado,68.4')}
function settings(){return '<h1>Settings & Profile</h1><p>Personalização da experiência de demonstração.</p><div class="grid"><section class="card span2"><h2>O teu perfil</h2><form onsubmit="saveProfile(event)"><label class="small">Nome de exibição</label><input id="profileName" class="field" maxlength="80" required value="'+esc(name)+'"><div style="margin-top:20px"><button class="action primary">Guardar alterações</button></div></form></section><section class="card"><h2>Aparência</h2><p>Alterna entre tema claro e escuro.</p>'+button('Alternar tema','themeToggle()',true)+'</section></div>'}
function saveProfile(e){e.preventDefault();name=$('profileName').value;save('ems-live-name',name);alert('Preferência guardada neste navegador.')}
function render(){$('nav').innerHTML=navItems.map(x=>'<button class="sidebtn '+(page===x[0]?'active':'')+'" title="'+x[2]+'" onclick="go(\''+x[0]+'\')"><span style="font-size:21px;width:22px">'+x[1]+'</span><span class="label">'+x[2]+'</span></button>').join('');$('content').innerHTML=({dashboard:dashboard,analytics:analytics,configuration:configuration,reports:reportsPage,settings:settings})[page]();document.title=navItems.find(x=>x[0]===page)[2]+' · EMS Control Demo'}
window.addEventListener('hashchange',()=>{let p=location.hash.replace('#/','');if(p!==page)go(p)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')searchClose();if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();searchOpen()}if(e.altKey&&/^[1-5]$/.test(e.key)){e.preventDefault();go(navItems[Number(e.key)-1][0])}if(e.key==='Enter'&&document.activeElement===$('q')){let x=navItems.find(x=>x[2].toLowerCase().includes($('q').value.toLowerCase()));if(x)go(x[0])}});
if(stored('ems-live-light',false))document.body.classList.add('light');page=(location.hash||'#/dashboard').replace('#/','');if(!navItems.some(x=>x[0]===page))page='dashboard';render();
</script></body></html>
